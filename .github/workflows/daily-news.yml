name: Daily News Pipeline

on:
  schedule:
    - cron: '30 2 * * *'

  workflow_dispatch:

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Project Newz
        run: |
          curl --fail-with-body --show-error --silent \
            --request POST \
            --data-urlencode "password=${{ secrets.PIPELINE_PASSWORD }}" \
            "https://projectnews-mocha.vercel.app/run_pipeline?debug=1"
