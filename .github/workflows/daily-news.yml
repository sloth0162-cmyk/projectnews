name: Daily News Pipeline

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Project Newz
        env:
          PIPELINE_PASSWORD: ${{ secrets.PIPELINE_PASSWORD }}
        run: |
          curl --fail-with-body --show-error --silent \
            -X POST \
            -F "password=${PIPELINE_PASSWORD}" \
            "https://projectnews-mocha.vercel.app/run_pipeline"