
<!-- =====================================================
     SLOTH NEWS | GLOBAL PAGE LOADER
     Include once per page, immediately before </body>
====================================================== -->

<div
    id="globalPageLoader"
    class="fixed inset-0 z-[99999] hidden items-center justify-center bg-slate-50/90 backdrop-blur-md"
    aria-hidden="true"
    role="status"
    aria-live="polite"
>
    <div class="w-[min(86vw,320px)] rounded-2xl border border-slate-200 bg-white p-7 shadow-2xl shadow-slate-900/10 text-center">

        <!-- Brand Icon -->
        <div class="relative mx-auto mb-5 flex h-16 w-16 items-center justify-center">

            <div class="absolute inset-0 rounded-2xl border-2 border-red-100"></div>

            <div class="absolute inset-0 rounded-2xl border-2 border-transparent border-t-red-600 sn-loader-spin"></div>

            <div class="flex h-11 w-11 items-center justify-center rounded-xl bg-red-600 text-white shadow-lg shadow-red-600/20">
                <span class="font-black text-2xl tracking-tight">S</span>
            </div>

        </div>

        <!-- Brand Name -->
        <h2 class="text-lg font-black tracking-[0.16em] text-slate-900">
            SLOTH <span class="text-red-600">NEWS</span>
        </h2>

        <p class="mt-1 text-[10px] font-bold uppercase tracking-[0.2em] text-slate-400">
            News. Context. Intelligence.
        </p>

        <!-- Loading Message -->
        <div class="mt-6 flex items-center justify-center gap-2">
            <span class="h-1.5 w-1.5 rounded-full bg-red-600 sn-loader-dot"></span>
            <span class="h-1.5 w-1.5 rounded-full bg-red-600 sn-loader-dot"></span>
            <span class="h-1.5 w-1.5 rounded-full bg-red-600 sn-loader-dot"></span>
            <span class="ml-1 text-xs font-semibold text-slate-500">
                Preparing your briefing
            </span>
        </div>

        <!-- Indeterminate Progress Bar -->
        <div class="mt-5 h-1 w-full overflow-hidden rounded-full bg-slate-100">
            <div class="h-full w-1/3 rounded-full bg-red-600 sn-loader-progress"></div>
        </div>

        <p class="mt-3 text-[10px] font-medium text-slate-400">
            Please wait a moment...
        </p>

    </div>
</div>

<style>
    @keyframes sn-spin {
        to { transform: rotate(360deg); }
    }

    @keyframes sn-dot {
        0%, 60%, 100% {
            opacity: 0.3;
            transform: translateY(0);
        }
        30% {
            opacity: 1;
            transform: translateY(-3px);
        }
    }

    @keyframes sn-progress {
        0%   { transform: translateX(-120%); }
        100% { transform: translateX(340%); }
    }

    .sn-loader-spin {
        animation: sn-spin 1.1s linear infinite;
    }

    .sn-loader-dot {
        animation: sn-dot 1s ease-in-out infinite;
    }

    .sn-loader-dot:nth-child(2) {
        animation-delay: 0.15s;
    }

    .sn-loader-dot:nth-child(3) {
        animation-delay: 0.3s;
    }

    .sn-loader-progress {
        animation: sn-progress 1.25s ease-in-out infinite;
    }

    @media (prefers-reduced-motion: reduce) {
        .sn-loader-spin,
        .sn-loader-dot,
        .sn-loader-progress {
            animation-duration: 3s;
        }
    }
</style>

<script>
(() => {
    "use strict";

    const loader = document.getElementById("globalPageLoader");

    if (!loader || loader.dataset.initialized === "true") return;

    loader.dataset.initialized = "true";

    // Avoid flashing the loader on fast navigation.
    const SHOW_DELAY = 150;

    let showTimer = null;
    let isLoading = false;

    function showLoader() {
        if (isLoading) return;

        isLoading = true;

        clearTimeout(showTimer);

        showTimer = setTimeout(() => {
            if (!isLoading) return;

            loader.classList.remove("hidden");
            loader.classList.add("flex");
            loader.setAttribute("aria-hidden", "false");
        }, SHOW_DELAY);
    }

    function hideLoader() {
        isLoading = false;

        clearTimeout(showTimer);
        showTimer = null;

        loader.classList.add("hidden");
        loader.classList.remove("flex");
        loader.setAttribute("aria-hidden", "true");
    }

    // Check whether an anchor should trigger page loading.
    function shouldHandleLink(link, event) {
        if (!link || event.defaultPrevented) return false;

        // Only ordinary left-click navigation.
        if (
            event.button !== 0 ||
            event.ctrlKey ||
            event.metaKey ||
            event.shiftKey ||
            event.altKey
        ) {
            return false;
        }

        if (
            link.hasAttribute("download") ||
            link.hasAttribute("data-no-loader") ||
            link.getAttribute("rel")?.split(/\s+/).includes("external")
        ) {
            return false;
        }

        const target = link.getAttribute("target");

        if (target && target.toLowerCase() !== "_self") {
            return false;
        }

        const href = link.getAttribute("href");

        if (!href || href.startsWith("#")) return false;

        if (/^(javascript:|mailto:|tel:|data:|blob:)/i.test(href.trim())) {
            return false;
        }

        let destination;

        try {
            destination = new URL(link.href, window.location.href);
        } catch {
            return false;
        }

        // External navigation should not use our loader.
        if (destination.origin !== window.location.origin) {
            return false;
        }

        // Ignore same-page navigation and anchor jumps.
        if (
            destination.pathname === window.location.pathname &&
            destination.search === window.location.search
        ) {
            return false;
        }

        return true;
    }

    // Delegated listener: also detects navbar links created by nav.js.
    document.addEventListener("click", (event) => {
        const link = event.target.closest("a[href]");

        if (!shouldHandleLink(link, event)) return;

        showLoader();
    });

    // Handle normal browser form submissions.
    document.addEventListener("submit", (event) => {
        const form = event.target;

        if (!(form instanceof HTMLFormElement)) return;
        if (event.defaultPrevented) return;
        if (form.hasAttribute("data-no-loader")) return;

        const target = form.getAttribute("target");

        if (target && target.toLowerCase() !== "_self") return;

        if (form.method.toLowerCase() === "dialog") return;

        showLoader();
    });

    // Restore the page correctly when navigating back/forward.
    window.addEventListener("pageshow", () => {
        hideLoader();
    });

})();
</script>
