<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/style/nav.css" />
  <link rel="stylesheet" href="/static/style/style.css" />
  <title>{{ article.title }}</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    .scrollbar-custom::-webkit-scrollbar {
      height: 8px;
    }

    .scrollbar-custom::-webkit-scrollbar-thumb {
      background-color: #cbd5e1;
      border-radius: 10px;
    }

    .scrollbar-custom::-webkit-scrollbar-thumb:hover {
      background-color: #94a3b8;
    }
  </style>
</head>

<body class="bg-gray-100">

<header></header>

<div class="max-w-6xl mx-auto mt-10 p-4">

    <div class="bg-white shadow-md rounded-lg overflow-hidden p-6">

        <h1 class="text-3xl font-bold mb-4">{{ article.title }}</h1>

        <div class="md:flex md:gap-6">

            <img
            src="{{ article.image_url }}"
            alt="{{ article.title }}"
            class="w-full md:w-1/3 rounded-lg object-cover mb-4 md:mb-0"
            >

            <p class="text-gray-700 md:w-2/3">
                {{ article.summary }}
            </p>

        </div>

    </div>

    {% include 'footer.html' %}
</div>

    <script src="{{ url_for('static', filename='nav.js') }}"></script>
    
</body>
</html>
