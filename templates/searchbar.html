<!-- Sloth News Channel: Search & Trending Topics Strip -->
<div class="hidden md:block max-w-7xl mx-auto px-4 sm:px-6 pt-5 pb-2">
  <div class="bg-white border border-slate-200 rounded-xl p-3 sm:p-4 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4">
    
    <!-- Trending Topics Chips -->
    <div class="flex items-center gap-2 overflow-x-auto pb-1 md:pb-0 scrollbar-none text-xs">
      <span class="font-bold text-red-600 flex items-center gap-1.5 uppercase tracking-wider shrink-0 mr-1">
        <i class="fa-solid fa-arrow-trend-up"></i> Trending:
      </span>
      <a href="/?tag=Market" class="shrink-0 px-2.5 py-1 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium transition">
        #MarketRally
      </a>
      <a href="/?tag=Technology" class="shrink-0 px-2.5 py-1 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium transition">
        #ArtificialIntelligence
      </a>
      <a href="/?tag=India" class="shrink-0 px-2.5 py-1 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium transition">
        #IndiaGrowth
      </a>
      <a href="/secondpage#crypto" class="shrink-0 px-2.5 py-1 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium transition">
        #Crypto90K
      </a>
      <a href="/?tag=Energy" class="shrink-0 px-2.5 py-1 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium transition">
        #OilAndEnergy
      </a>
      <a href="/editorial" class="shrink-0 px-2.5 py-1 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium transition">
        #DailyOpinion
      </a>
    </div>

    <!-- Search Input Form -->
    <form action="/" method="GET" role="search" class="flex items-center gap-2 w-full md:w-auto md:min-w-[320px]">
      <div class="relative flex-1">
        <input
          type="text"
          name="search"
          placeholder="Search by headline or topic..."
          value="{{ search_query if search_query is defined else '' }}"
          class="w-full pl-9 pr-4 py-2 text-xs sm:text-sm bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:border-red-600 focus:bg-white text-slate-900 transition"
          aria-label="Search articles"
        />
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
      </div>
      <button
        type="submit"
        class="px-4 py-2 bg-slate-900 hover:bg-red-600 text-white rounded-lg text-xs font-bold uppercase tracking-wider transition shrink-0 flex items-center gap-1.5 shadow-sm"
      >
        <span>Search</span>
        <i class="fa-solid fa-arrow-right text-[10px]"></i>
      </button>
      {% if search_query %}
      <a
        href="/"
        class="px-2.5 py-2 text-xs text-slate-500 hover:text-red-600 font-semibold"
        title="Clear search"
      >
        <i class="fa-solid fa-xmark"></i>
      </a>
      {% endif %}
    </form>

  </div>
</div>
<!-- ===== MOBILE: Compact Search + 4 Tags (hidden on md and up) ===== -->
<div class="md:hidden px-3 pt-3 pb-1">
  <div class="bg-white border border-slate-200 rounded-lg p-2.5 shadow-sm space-y-2">

    <!-- Compact Search -->
    <form action="/" method="GET" role="search" class="flex items-center gap-1.5">
      <div class="relative flex-1">
        <input
          type="text"
          name="search"
          placeholder="Search news..."
          value="{{ search_query if search_query is defined else '' }}"
          class="w-full pl-8 pr-3 py-1.5 text-xs bg-slate-50 border border-slate-300 rounded-md focus:outline-none focus:border-red-600 focus:bg-white text-slate-900 transition"
          aria-label="Search articles"
        />
        <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400 text-[11px]"></i>
      </div>
      <button
        type="submit"
        class="w-8 h-8 flex items-center justify-center bg-slate-900 active:bg-red-600 text-white rounded-md shrink-0"
        aria-label="Search"
      >
        <i class="fa-solid fa-arrow-right text-[10px]"></i>
      </button>
      {% if search_query %}
      <a href="/" class="w-8 h-8 flex items-center justify-center text-slate-500 hover:text-red-600 shrink-0" title="Clear search">
        <i class="fa-solid fa-xmark text-xs"></i>
      </a>
      {% endif %}
    </form>

    <!-- 4 Tags Only -->
    <div class="flex items-center gap-1.5 overflow-x-auto scrollbar-none text-[11px]">
      <span class="font-bold text-red-600 flex items-center gap-1 uppercase tracking-wide shrink-0">
        <i class="fa-solid fa-arrow-trend-up"></i>
      </span>
      <a href="/?tag=Market" class="shrink-0 px-2 py-0.5 rounded-full bg-slate-100 active:bg-slate-200 text-slate-700 font-medium">#MarketRally</a>
      <a href="/?tag=Technology" class="shrink-0 px-2 py-0.5 rounded-full bg-slate-100 active:bg-slate-200 text-slate-700 font-medium">#AI</a>
      <a href="/?tag=India" class="shrink-0 px-2 py-0.5 rounded-full bg-slate-100 active:bg-slate-200 text-slate-700 font-medium">#IndiaGrowth</a>
      <a href="/secondpage#crypto" class="shrink-0 px-2 py-0.5 rounded-full bg-slate-100 active:bg-slate-200 text-slate-700 font-medium">#Crypto90K</a>
    </div>

  </div>
</div>
